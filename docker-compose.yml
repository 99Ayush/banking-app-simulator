services:
  api:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/banking-app?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      BANK_TIMEZONE: ${BANK_TIMEZONE:-Asia/Kolkata}
      DAILY_TRANSFER_LIMIT_PAISE: ${DAILY_TRANSFER_LIMIT_PAISE:-10000000}
      SANDBOX_DEPOSITS_ENABLED: "true"
      TRUST_PROXY_HOPS: 0
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { quit(rs.status().ok ? 0 : 1) } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); quit(1) }"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  mongo-data:
  redis-data:
